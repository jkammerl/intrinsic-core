# Packages used to build base image for simulation rendering and perception.
# Anytime this file is changed, the lockfile needs to be regenerated.
#
# To generate the bullseye_mesa.lock.json run the following command
#
# bazel run @bullseye_mesa//:lock

version: 1

archs:
  - "amd64"
  - "arm64"

sources:
  - type: deb
    url: https://snapshot.debian.org/archive/debian/20260320T204549Z/
    channel: bullseye main

packages:
  - libegl-mesa0
  - libglx-mesa0
  - libgl1
  - libegl1
  - libglvnd0
  - libx11-6
  - libxrender1
  - libglib2.0-0
  - python3
  - coreutils
  - base-files
